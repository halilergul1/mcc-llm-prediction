[project]
name = "mcc-llm"
version = "3.0.0"
description = "Instruction-tuned LLMs and sequential baselines for cross-institution merchant category prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Halil Ibrahim Ergul" },
    { name = "Selim Balcisoy" },
    { name = "Burcin Bozkaya" },
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "scipy>=1.11",
    "torch>=2.2",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
llm = [
    "transformers>=5.0",
    "peft>=0.17",
    "trl>=1.0",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.46",
]
serve = ["vllm==0.30.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcc_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
